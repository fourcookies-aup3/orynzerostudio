<!DOCTYPE html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORYN — Premium FPV & Aerial Cinematography</title>
    <meta name="description" content="ORYN Media Production — High-end FPV Drone Cinematography, Aerial Shots, and Visual Storytelling based in Switzerland." />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages route redirect handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-black text-white antialiased selection:bg-accent selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
